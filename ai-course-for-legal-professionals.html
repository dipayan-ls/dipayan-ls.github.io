  toast(STATE.bookmarks[id]?'Bookmarked':'Bookmark removed'); }
function setConf(id,n){ STATE.conf[id]=n; saveState(); document.querySelectorAll('.conf-dot').forEach((d,i)=>d.classList.toggle('sel',i+1===n)); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============================================================
   GLOSSARY + FLASHCARDS
   ============================================================ */
const CLUSTERS = ['All','Core ML/LLM','AI Security','Data & Privacy','Regulation','LegalTech'];
let glossFilter='All', glossQuery='';
function renderGlossary(){
  const reading=document.getElementById('reading');
  reading.innerHTML = `
    <div class="eyebrow">${svgInline(I.book,13)} Living Reference</div>
    <h1 class="lesson-title">Glossary &amp; Flashcards</h1>
    <p class="lesson-dek">Every term gets six fields: plain English, the technical definition, a legal or banking analogy, where it shows up, related concepts, and one real source. The same deck doubles as spaced-repetition flashcards.</p>
    <div class="gloss-controls">
      <input class="gloss-search" id="glossSearch" placeholder="Search ${GLOSSARY.length} terms…" oninput="glossQuery=this.value;paintGlossary()">
      <button class="btn primary" onclick="startFlash()">${svgInline(I.layers,14)} Flashcard mode</button>
    </div>
    <div class="cluster-filter" id="clusterFilter">
      ${CLUSTERS.map(c=>`<div class="cl-chip ${c===glossFilter?'active':''}" onclick="glossFilter='${c}';paintGlossary()">${c}</div>`).join('')}
    </div>
    <div id="glossList" style="margin-top:18px"></div>`;
  document.getElementById('rail').innerHTML='';
  setActiveNav(null,'glossary');
  paintGlossary(); window.scrollTo(0,0);
}
function matchCluster(g){ return glossFilter==='All' || g.cluster===glossFilter; }
function paintGlossary(){
  document.querySelectorAll('#clusterFilter .cl-chip').forEach(c=>c.classList.toggle('active', c.textContent===glossFilter));
  const q=glossQuery.toLowerCase().trim();
  const list = GLOSSARY.filter(g=>matchCluster(g) && (!q || g.term.toLowerCase().includes(q) || (g.plain||'').toLowerCase().includes(q)))
    .sort((a,b)=>a.term.localeCompare(b.term));
  const el=document.getElementById('glossList');
  if(!list.length){ el.innerHTML=`<div class="sr-empty">No terms match "${glossQuery}".</div>`; return; }
  el.innerHTML = list.map(g=>`
    <div class="gterm" data-term="${g.term}">
      <div class="gterm-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="gterm-name">${g.term}</span>
        <span class="gterm-plain">${g.plain}</span>
        <svg class="gterm-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="gterm-body"><div class="gterm-inner">
        <div class="gfield"><div class="gfield-label">Technical definition</div><p>${g.tech}</p></div>
        <div class="gfield"><div class="gfield-label">Legal / banking analogy</div><p>${g.analogy}</p></div>
        <div class="gfield"><div class="gfield-label">Where it shows up</div><p>${g.where}</p></div>
        ${g.related?`<div class="gfield"><div class="gfield-label">Related concepts</div><p>${g.related.map(r=>`<span class="related-link" onclick="openTerm('${r.replace(/'/g,"\\'")}')">${r}</span>`).join('')}</p></div>`:''}
        ${g.source?`<div class="gfield"><div class="gfield-label">Further reading</div><p>${g.source}</p></div>`:''}
      </div></div>
    </div>`).join('');
}
function openTerm(term){
  if(location.hash!=='#glossary'){ go('#glossary'); setTimeout(()=>focusTerm(term),120); } else focusTerm(term);
}
function focusTerm(term){
  glossFilter='All'; glossQuery=term; const s=document.getElementById('glossSearch'); if(s)s.value=term; paintGlossary();
  setTimeout(()=>{ const el=document.querySelector(`.gterm[data-term="${term}"]`); if(el){ el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'center'}); } },60);
}

/* flashcards */
let flashDeck=[], flashIdx=0;
function startFlash(){
  flashDeck = GLOSSARY.filter(matchCluster).filter(g=>STATE.flash[g.term]!=='known');
  if(!flashDeck.length) flashDeck = GLOSSARY.filter(matchCluster);
  flashIdx=0; renderFlash();
}
function renderFlash(){
  const reading=document.getElementById('reading');
  if(!flashDeck.length){ renderGlossary(); return; }
  const g=flashDeck[flashIdx];
  reading.innerHTML = `
    <div class="eyebrow">${svgInline(I.layers,13)} Flashcards · ${glossFilter}</div>
    <div class="flash-meta">Card ${flashIdx+1} of ${flashDeck.length} &nbsp;·&nbsp; ${GLOSSARY.filter(x=>STATE.flash[x.term]==='known').length} marked known</div>
    <div class="flash-stage">
      <div class="flashcard" id="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="flash-inner">
          <div class="flash-face front">
            <div class="flash-kicker">${g.cluster}</div>
            <div class="flash-term">${g.term}</div>
            <div class="flash-hint">Tap to reveal the plain-English meaning</div>
          </div>
          <div class="flash-face back">
            <div class="flash-kicker">Plain English</div>
            <div class="flash-def">${g.plain}</div>
            <div class="flash-hint">${g.analogy}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="flash-controls">
      <button class="btn" onclick="flashMark('again')">↺ Show me again later</button>
      <button class="btn primary" onclick="flashMark('known')">✓ I know this</button>
    </div>
    <div style="text-align:center;margin-top:18px"><button class="foot-link" style="display:inline-flex" onclick="renderGlossary()">${svgInline(I.arrowL,15)} Back to glossary list</button></div>`;
  document.getElementById('rail').innerHTML=''; window.scrollTo(0,0);
}
function flashMark(s){
  const g=flashDeck[flashIdx]; STATE.flash[g.term]= s==='known'?'known':'again'; saveState();
  flashIdx++; if(flashIdx>=flashDeck.length){ toast('Deck complete'); renderGlossary(); } else renderFlash();
}

/* ============================================================
   REFERENCES
   ============================================================ */
function renderReferences(){
  const reading=document.getElementById('reading');
  reading.innerHTML = `
    <div class="eyebrow">${svgInline(I.book,13)} Curated · Real · Verifiable</div>
    <h1 class="lesson-title">Reference Library</h1>
    <p class="lesson-dek">Nothing here is invented. Where a resource couldn't be verified as real and current, it was left out rather than fabricated — exactly as the brief demands.</p>
    ${REFERENCES.map(sec=>`
      <h2>${sec.group}</h2>
      ${sec.intro?`<p>${sec.intro}</p>`:''}
      <div class="table-wrap"><table class="data"><thead><tr><th>Resource</th><th>Why it matters</th></tr></thead><tbody>
        ${sec.items.map(it=>`<tr><td>${it.link?`<a href="${it.link}" target="_blank" rel="noopener">${it.name}</a>`:`<strong>${it.name}</strong>`}</td><td>${it.note}</td></tr>`).join('')}
      </tbody></table></div>`).join('')}
    <div class="callout co-aha"><svg class="co-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg>
      <div class="co-title">If you only do five things after this course</div>
      <ol style="margin:8px 0 0;padding-left:20px;color:var(--text-soft)">
        <li>Read the EU AI Act risk-tier summary and India's DPDP Act 2023 once, end to end.</li>
        <li>Build your own AI Vendor Data Security Due-Diligence Checklist (Module 15) and keep it on your desktop.</li>
        <li>Run one real contract through a "trust but verify" decision tree (Module 7) and document what you'd re-check by hand.</li>
        <li>Draft and save five reusable legal prompts (Module 8) for review, due diligence, summarisation, redlining, and risk analysis.</li>
        <li>Write your one-page AI Adoption &amp; Governance Charter (Module 18) and take it to an interview.</li>
      </ol></div>`;
  document.getElementById('rail').innerHTML='';
  setActiveNav(null,'references'); window.scrollTo(0,0);
}

/* ============================================================
   SEARCH
   ============================================================ */
function openSearch(){ document.getElementById('searchModal').classList.add('show'); const i=document.getElementById('searchInput'); i.value=''; runSearch(''); setTimeout(()=>i.focus(),50); }
function closeSearch(){ document.getElementById('searchModal').classList.remove('show'); }
function runSearch(q){
  q=q.toLowerCase().trim();
  const res=document.getElementById('searchResults');
  if(!q){
    res.innerHTML = `<div class="sr-section">Jump to</div>
      <div class="sr-item" onclick="go('#home');closeSearch()"><div class="sr-icon">${svgInline(I.layers,16)}</div><div><div class="sr-title">Course Home</div><div class="sr-sub">Pillars, modules, your progress</div></div></div>
      <div class="sr-item" onclick="go('#glossary');closeSearch()"><div class="sr-icon">${svgInline(I.book,16)}</div><div><div class="sr-title">Glossary &amp; Flashcards</div><div class="sr-sub">${GLOSSARY.length} terms</div></div></div>
      <div class="sr-item" onclick="go('#references');closeSearch()"><div class="sr-icon">${svgInline(I.book,16)}</div><div><div class="sr-title">Reference Library</div><div class="sr-sub">Real, verified resources</div></div></div>`;
    return;
  }
  const lh = [];
  COURSE.forEach(m=>m.lessons.forEach(l=>{ if(l.title.toLowerCase().includes(q)||(l.dek||'').toLowerCase().includes(q)||m.title.toLowerCase().includes(q)) lh.push({l,m}); }));
  const gh = GLOSSARY.filter(g=>g.term.toLowerCase().includes(q)||(g.plain||'').toLowerCase().includes(q)).slice(0,6);
  let html='';
  if(lh.length){ html+=`<div class="sr-section">Lessons</div>`+lh.slice(0,7).map(({l,m})=>`<div class="sr-item" onclick="go('#l/${l.id}');closeSearch()"><div class="sr-icon">${svgInline(I.book,16)}</div><div><div class="sr-title">${l.title}</div><div class="sr-sub">${m.num} · ${m.title}</div></div></div>`).join(''); }
  if(gh.length){ html+=`<div class="sr-section">Glossary</div>`+gh.map(g=>`<div class="sr-item" onclick="openTerm('${g.term.replace(/'/g,"\\'")}');closeSearch()"><div class="sr-icon">${svgInline('<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',16)}</div><div><div class="sr-title">${g.term}</div><div class="sr-sub">${g.plain}</div></div></div>`).join(''); }
  res.innerHTML = html || `<div class="sr-empty">No results for "${q}".</div>`;
}

/* ============================================================
   DIAGRAMS
   ============================================================ */
function renderDiagramsNow(){
  if(!window.mermaid) return;
  document.querySelectorAll('.mermaid').forEach((el,i)=>{
    const def = DIAGRAM_DEFS[el.id]; if(!def) return;
    const gid='g'+el.id+'-'+Date.now();
    try{ mermaid.render(gid, def).then(({svg})=>{ el.innerHTML=svg; }).catch(()=>{ el.innerHTML='<p style="color:var(--text-mute);font-size:13px">[diagram]</p>'; }); }
    catch(e){ el.innerHTML=escapeHtml(def); }
  });
}
function rerenderDiagrams(){ const h=location.hash; route(); }

/* ============================================================
   ROUTER
   ============================================================ */
function go(hash){ if(location.hash===hash){ route(); } else location.hash=hash; closeSidebar(); }
function route(){
  const h=location.hash||'#home';
  if(h==='#home') renderHome();
  else if(h==='#glossary') renderGlossary();
  else if(h==='#flashcards'){ renderGlossary(); startFlash(); }
  else if(h==='#references') renderReferences();
  else if(h.startsWith('#l/')){ const id=h.slice(3); STATE.last=id; saveState(); renderLesson(id); }
  else renderHome();
}
window.addEventListener('hashchange',route);

/* ---------- sidebar mobile ---------- */
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('scrim').classList.toggle('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
  if(e.key==='Escape') closeSearch();
});

/* ---------- INIT ---------- */
applyTheme();
buildNav();
if(window.mermaid){ mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:mermaidTheme(), securityLevel:'loose', flowchart:{curve:'basis'}}); }
route();
updateRing();

</script>
