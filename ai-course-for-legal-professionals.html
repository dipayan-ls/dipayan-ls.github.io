<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI-Native Lawyer — A Masterclass for Corporate Counsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
/* ============================================================
   THE AI-NATIVE LAWYER — Design System
   "Midnight Chambers": ink + gold leaf + oxblood
   ============================================================ */

:root {
  /* dark (default) — a law library at midnight */
  --bg:            #0B0E14;
  --bg-elev:       #11151F;
  --surface:       #141925;
  --surface-2:     #1A2030;
  --surface-hover: #1F273A;
  --line:          #242C3D;
  --line-strong:   #313B52;

  --text:          #E7EAF2;
  --text-soft:     #B6BECD;
  --text-mute:     #828DA1;
  --text-faint:    #5C6577;

  --gold:          #CBA557;   /* gold leaf / embossed spine */
  --gold-soft:     #E0C588;
  --gold-dim:      #8A7236;
  --gold-glow:     rgba(203,165,87,.14);

  --oxblood:       #C75660;   /* law-library leather red — risk */
  --oxblood-soft:  #E08891;
  --ledger:        #5FAE92;   /* banker's green — verified */
  --ledger-soft:   #8FCEB8;
  --sky:           #6F9BD8;   /* references / links */
  --violet:        #9B86D6;   /* for-the-curious */

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow:    0 8px 30px rgba(0,0,0,.45);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.55);

  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --serif: 'Fraunces', Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;

  --r-sm: 8px; --r: 12px; --r-lg: 18px; --r-xl: 26px;
  --maxread: 720px;
  --sidebar-w: 312px;
  --rail-w: 244px;
  --topbar-h: 60px;
  --ease: cubic-bezier(.2,.7,.2,1);
}

html[data-theme="light"] {
  --bg:            #FBFAF6;
  --bg-elev:       #FFFFFF;
  --surface:       #FFFFFF;
  --surface-2:     #F4F1E9;
  --surface-hover: #EFEBE0;
  --line:          #E6E1D4;
  --line-strong:   #D6CFBC;

  --text:          #161B24;
  --text-soft:     #3C4554;
  --text-mute:     #6B7486;
  --text-faint:    #97A0B0;

  --gold:          #9A7A2E;
  --gold-soft:     #B79447;
  --gold-dim:      #C9B988;
  --gold-glow:     rgba(154,122,46,.10);

  --oxblood:       #AA3742;
  --oxblood-soft:  #8A2630;
  --ledger:        #2F7C61;
  --ledger-soft:   #1F6650;
  --sky:           #3B6CB0;
  --violet:        #6A55A8;

  --shadow-sm: 0 1px 2px rgba(40,33,15,.06);
  --shadow:    0 10px 34px rgba(40,33,15,.10);
  --shadow-lg: 0 24px 60px rgba(40,33,15,.16);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv05","ss01";
  letter-spacing: -0.003em;
  transition: background .4s var(--ease), color .4s var(--ease);
}

/* faint ambient grain / vignette */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1200px 700px at 78% -10%, var(--gold-glow), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(111,155,216,.05), transparent 55%);
}

::selection { background: var(--gold); color: #11151F; }
html[data-theme="light"] ::selection { background: var(--gold-soft); color: #161B24; }

a { color: var(--sky); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* scrollbars */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ===================== APP SHELL ===================== */
.app { position: relative; z-index: 1; display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0,1fr);
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas: "brand topbar" "sidebar main";
  min-height: 100vh; }

/* --- Topbar --- */
.topbar { grid-area: topbar; display: flex; align-items: center; gap: 14px;
  padding: 0 22px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 40; }
.brandcell { grid-area: brand; display: flex; align-items: center; gap: 11px;
  padding: 0 20px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px);
  position: sticky; top: 0; z-index: 41; }
.crest { width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(150deg, var(--gold-soft), var(--gold-dim));
  display: grid; place-items: center; box-shadow: var(--shadow-sm);
  color: #15110A; font-family: var(--serif); font-weight: 700; font-size: 16px; }
.brand-name { font-family: var(--serif); font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; line-height: 1.1; }
.brand-sub { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }

.search-btn { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 440px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-mute);
  border-radius: 10px; padding: 8px 13px; cursor: pointer; font-size: 13.5px; font-family: var(--sans);
  transition: border-color .2s, background .2s; }
.search-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.search-btn kbd { margin-left: auto; font-family: var(--mono); font-size: 10.5px; background: var(--bg-elev);
  border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; color: var(--text-faint); }
.topbar-spacer { flex: 1; }

.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text-soft); cursor: pointer; display: grid; place-items: center;
  transition: all .2s var(--ease); }
.icon-btn:hover { background: var(--surface-2); border-color: var(--line-strong); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

.progress-ring { display: flex; align-items: center; gap: 9px; padding: 5px 11px 5px 6px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.ring-svg { width: 30px; height: 30px; transform: rotate(-90deg); }
.ring-svg .bg { stroke: var(--line); }
.ring-svg .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); }
.ring-label { font-family: var(--mono); font-size: 11px; color: var(--text-soft); white-space: nowrap; }
.ring-label b { color: var(--text); }

/* --- Sidebar --- */
.sidebar { grid-area: sidebar; border-right: 1px solid var(--line); overflow-y: auto;
  padding: 16px 12px 80px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); }
.side-section-label { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-faint); padding: 14px 12px 7px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 9px;
  color: var(--text-soft); cursor: pointer; font-size: 13.5px; font-weight: 500; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--gold-glow); color: var(--gold-soft); }
.nav-item svg { width: 16px; height: 16px; flex: none; opacity: .8; }

.mod-group { margin-bottom: 1px; }
.mod-head { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
  cursor: pointer; transition: background .15s; user-select: none; }
.mod-head:hover { background: var(--surface); }
.mod-num { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--gold);
  width: 26px; height: 22px; flex: none; display: grid; place-items: center;
  background: var(--gold-glow); border-radius: 6px; }
.mod-title { font-size: 13px; font-weight: 550; color: var(--text); line-height: 1.25; flex: 1; }
.mod-chev { width: 15px; height: 15px; color: var(--text-faint); transition: transform .25s var(--ease); flex: none; }
.mod-group.open .mod-chev { transform: rotate(90deg); }
.mod-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line-strong); }
.mod-dot.partial { background: var(--gold); }
.mod-dot.done { background: var(--ledger); }

.lessons { max-height: 0; overflow: hidden; transition: max-height .3s var(--ease); padding-left: 8px; }
.mod-group.open .lessons { max-height: 1400px; }
.lesson-item { display: flex; align-items: center; gap: 9px; padding: 6.5px 10px 6.5px 30px; border-radius: 8px;
  cursor: pointer; font-size: 12.5px; color: var(--text-mute); position: relative; transition: background .15s, color .15s; }
.lesson-item:hover { background: var(--surface); color: var(--text-soft); }
.lesson-item.active { color: var(--gold-soft); background: var(--gold-glow); }
.lesson-item.active::before { content:""; position:absolute; left: 13px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 15px; background: var(--gold); border-radius: 3px; }
.lesson-check { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-strong);
  display: grid; place-items: center; transition: all .2s; }
.lesson-item.done .lesson-check { background: var(--ledger); border-color: var(--ledger); }
.lesson-check svg { width: 9px; height: 9px; color: #0B0E14; opacity: 0; }
.lesson-item.done .lesson-check svg { opacity: 1; }
.lesson-label { flex: 1; line-height: 1.3; }
.lesson-bookmark { width: 12px; height: 12px; color: var(--gold); opacity: 0; flex: none; }
.lesson-item.bookmarked .lesson-bookmark { opacity: 1; }

/* --- Main --- */
.main { grid-area: main; overflow-x: hidden; }
.main-inner { display: grid; grid-template-columns: minmax(0,1fr) var(--rail-w); gap: 40px;
  max-width: 1180px; margin: 0 auto; padding: 0 36px; }
.reading { min-width: 0; padding: 46px 0 140px; }
.rail { padding: 46px 0; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h));
  overflow-y: auto; }

/* ===================== READING TYPOGRAPHY ===================== */
.reading { max-width: var(--maxread); }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.eyebrow::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, var(--gold-dim), transparent); opacity: .5; }

.lesson-title { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 4.2vw, 42px);
  line-height: 1.08; letter-spacing: -.02em; margin-bottom: 14px; font-optical-sizing: auto; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-mute); font-size: 13px; margin-bottom: 8px; }
.lesson-meta span { display: inline-flex; align-items: center; gap: 6px; }
.lesson-meta svg { width: 14px; height: 14px; }
.lesson-dek { font-size: 17.5px; color: var(--text-soft); line-height: 1.55; margin: 18px 0 0;
  font-family: var(--serif); font-weight: 400; font-style: italic; }

.reading h2 { font-family: var(--serif); font-weight: 600; font-size: 25px; letter-spacing: -.015em;
  margin: 44px 0 14px; line-height: 1.2; }
.reading h3 { font-size: 18px; font-weight: 650; margin: 30px 0 10px; letter-spacing: -.01em; }
.reading p { font-size: 16.5px; color: var(--text-soft); margin: 0 0 16px; }
.reading p strong, .reading li strong { color: var(--text); font-weight: 600; }
.reading ul, .reading ol { margin: 0 0 18px; padding-left: 24px; color: var(--text-soft); font-size: 16.5px; }
.reading li { margin-bottom: 8px; }
.reading em { color: var(--text); }
.reading hr { border: none; border-top: 1px solid var(--line); margin: 40px 0; }
code.inline { font-family: var(--mono); font-size: 13.5px; background: var(--surface-2);
  border: 1px solid var(--line); padding: 1.5px 6px; border-radius: 6px; color: var(--gold-soft); }

/* ===================== THE SEVEN-BEAT SPINE (signature) ===================== */
.beats { position: relative; margin: 38px 0; padding-left: 46px; }
.beats::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px;
  background: linear-gradient(180deg, var(--gold-dim), var(--line) 60%); }
.beat { position: relative; margin-bottom: 34px; }
.beat:last-child { margin-bottom: 0; }
.beat-mark { position: absolute; left: -46px; top: -2px; width: 32px; height: 32px; border-radius: 9px;
  background: var(--bg); border: 1.5px solid var(--gold-dim); color: var(--gold);
  font-family: var(--mono); font-size: 12px; font-weight: 600; display: grid; place-items: center; z-index: 1; }
.beat-kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 6px; }
.beat-name { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 10px; }

/* ===================== CALLOUT BOXES ===================== */
.callout { border-radius: var(--r); padding: 18px 20px 18px 52px; margin: 22px 0; position: relative;
  border: 1px solid var(--line); background: var(--surface); }
.callout::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; }
.callout .co-icon { position: absolute; left: 17px; top: 18px; width: 20px; height: 20px; }
.callout .co-title { font-weight: 650; font-size: 13px; letter-spacing: .02em; text-transform: uppercase;
  font-family: var(--mono); margin-bottom: 6px; }
.callout p:last-child { margin-bottom: 0; }
.callout p { font-size: 15.5px; }

.co-story::before   { background: var(--sky); }
.co-story .co-icon, .co-story .co-title   { color: var(--sky); }
.co-aha             { background: linear-gradient(110deg, var(--gold-glow), transparent 70%); border-color: var(--gold-dim); }
.co-aha::before     { background: var(--gold); }
.co-aha .co-icon, .co-aha .co-title       { color: var(--gold); }
.co-aha .aha-line   { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--text); line-height: 1.3; font-style: italic; }
.co-warn::before    { background: var(--oxblood); }
.co-warn .co-icon, .co-warn .co-title     { color: var(--oxblood); }
.co-warn            { background: color-mix(in srgb, var(--oxblood) 7%, var(--surface)); border-color: color-mix(in srgb, var(--oxblood) 28%, var(--line)); }
.co-curious::before { background: var(--violet); }
.co-curious .co-icon, .co-curious .co-title { color: var(--violet); }
.co-ref::before     { background: var(--ledger); }
.co-ref .co-icon, .co-ref .co-title       { color: var(--ledger); }
.co-ref code { font-family: var(--mono); font-size: 13px; color: var(--ledger-soft); }

/* expandable "for the curious" */
.expand { border: 1px solid var(--line); border-radius: var(--r); margin: 22px 0; overflow: hidden; background: var(--surface); }
.expand-head { display: flex; align-items: center; gap: 11px; padding: 14px 18px; cursor: pointer; user-select: none; transition: background .15s; }
.expand-head:hover { background: var(--surface-2); }
.expand-head .ex-icon { width: 18px; height: 18px; color: var(--violet); }
.expand-head .ex-title { font-weight: 600; font-size: 14.5px; flex: 1; }
.expand-head .ex-chev { width: 16px; height: 16px; color: var(--text-faint); transition: transform .25s; }
.expand.open .ex-chev { transform: rotate(180deg); }
.expand-body { max-height: 0; overflow: hidden; transition: max-height .35s var(--ease); }
.expand.open .expand-body { max-height: 1600px; }
.expand-body-inner { padding: 0 18px 16px; border-top: 1px solid var(--line); }
.expand-body-inner p:first-child { margin-top: 14px; }

/* ===================== TABLES ===================== */
.table-wrap { overflow-x: auto; margin: 24px 0; border: 1px solid var(--line); border-radius: var(--r); }
table.data { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.data th { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-mute); padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
table.data td { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--text-soft); vertical-align: top; }
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: var(--surface); }

/* ===================== MERMAID ===================== */
.diagram { margin: 26px 0; padding: 22px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); text-align: center; overflow-x: auto; }
.diagram .dia-cap { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-faint); margin-top: 14px; }

/* ===================== QUIZ ===================== */
.quiz { border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 24px; margin: 34px 0;
  background: linear-gradient(180deg, var(--surface), var(--bg-elev)); }
.quiz-label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 4px; }
.quiz-q { font-size: 17px; font-weight: 600; margin: 14px 0 16px; color: var(--text); font-family: var(--serif); }
.quiz-opt { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border: 1px solid var(--line);
  border-radius: var(--r); margin-bottom: 10px; cursor: pointer; transition: all .18s var(--ease); font-size: 15px; color: var(--text-soft); }
.quiz-opt:hover { border-color: var(--line-strong); background: var(--surface); }
.quiz-opt .opt-key { font-family: var(--mono); font-size: 12px; width: 22px; height: 22px; flex: none; border-radius: 6px;
  border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--text-mute); transition: all .18s; }
.quiz-opt.correct { border-color: var(--ledger); background: color-mix(in srgb, var(--ledger) 12%, transparent); color: var(--text); }
.quiz-opt.correct .opt-key { background: var(--ledger); border-color: var(--ledger); color: #0B0E14; }
.quiz-opt.wrong { border-color: var(--oxblood); background: color-mix(in srgb, var(--oxblood) 10%, transparent); }
.quiz-opt.wrong .opt-key { background: var(--oxblood); border-color: var(--oxblood); color: #fff; }
.quiz-opt.disabled { pointer-events: none; opacity: .55; }
.quiz-opt.disabled.correct, .quiz-opt.disabled.wrong { opacity: 1; }
.quiz-feedback { margin-top: 14px; padding: 14px 16px; border-radius: var(--r); font-size: 14.5px; display: none; line-height: 1.55; }
.quiz-feedback.show { display: block; animation: slidein .35s var(--ease); }
.quiz-feedback.ok { background: color-mix(in srgb, var(--ledger) 10%, transparent); border: 1px solid color-mix(in srgb,var(--ledger) 30%,transparent); color: var(--text-soft); }
.quiz-feedback.no { background: color-mix(in srgb, var(--oxblood) 9%, transparent); border: 1px solid color-mix(in srgb,var(--oxblood) 30%,transparent); color: var(--text-soft); }
.quiz-feedback b { color: var(--text); }
.quiz-progress { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); margin-top: 16px; }
@keyframes slidein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===================== BRANCHING SCENARIO ===================== */
.branch { border: 1px solid var(--gold-dim); border-radius: var(--r-lg); margin: 34px 0; overflow: hidden;
  background: linear-gradient(180deg, var(--gold-glow), transparent 40%); }
.branch-head { padding: 18px 22px; border-bottom: 1px solid var(--line); }
.branch-tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.branch-prompt { font-family: var(--serif); font-size: 19px; font-weight: 600; margin-top: 8px; line-height: 1.3; }
.branch-body { padding: 18px 22px; }
.branch-choice { display: block; width: 100%; text-align: left; padding: 15px 18px; border: 1px solid var(--line);
  border-radius: var(--r); margin-bottom: 12px; cursor: pointer; background: var(--surface); color: var(--text);
  font-size: 15.5px; font-weight: 550; font-family: var(--sans); transition: all .18s var(--ease); }
.branch-choice:hover { border-color: var(--gold-dim); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.branch-outcome { display: none; margin-top: 6px; padding: 16px 18px; border-radius: var(--r); font-size: 15px; line-height: 1.6;
  border-left: 3px solid; animation: slidein .35s var(--ease); }
.branch-outcome.show { display: block; }
.branch-outcome.good { border-color: var(--ledger); background: color-mix(in srgb,var(--ledger) 9%,var(--surface)); }
.branch-outcome.bad  { border-color: var(--oxblood); background: color-mix(in srgb,var(--oxblood) 9%,var(--surface)); }
.branch-outcome.mixed{ border-color: var(--gold); background: var(--gold-glow); }
.branch-outcome .oc-verdict { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; display: block; }
.branch-reset { font-family: var(--mono); font-size: 12px; color: var(--gold); cursor: pointer; background: none; border: none; margin-top: 6px; }

/* ===================== "BUILD YOUR OWN" / EXPLAIN-IT-BACK ===================== */
.exercise { border: 1px dashed var(--line-strong); border-radius: var(--r-lg); padding: 22px; margin: 34px 0; background: var(--surface); }
.exercise-tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ledger); margin-bottom: 8px; }
.exercise-title { font-family: var(--serif); font-size: 19px; font-weight: 600; margin-bottom: 8px; }
.exercise textarea { width: 100%; min-height: 120px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--r);
  padding: 13px 15px; color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.55; resize: vertical; margin-top: 12px; }
.exercise textarea:focus { outline: none; border-color: var(--gold-dim); }
.exercise-actions { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
.btn { font-family: var(--sans); font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); transition: all .18s; }
.btn:hover { border-color: var(--gold-dim); }
.btn.primary { background: var(--gold); color: #14110A; border-color: var(--gold); }
.btn.primary:hover { background: var(--gold-soft); }
.saved-flag { font-family: var(--mono); font-size: 11.5px; color: var(--ledger); opacity: 0; transition: opacity .3s; }
.saved-flag.show { opacity: 1; }
.model-answer { margin-top: 14px; }

/* ===================== LESSON FOOTER NAV ===================== */
.lesson-foot { display: flex; align-items: center; gap: 14px; margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); }
.complete-btn { display: inline-flex; align-items: center; gap: 9px; padding: 12px 22px; border-radius: 11px;
  background: var(--gold); color: #14110A; border: none; font-weight: 650; font-size: 14.5px; cursor: pointer; font-family: var(--sans);
  transition: all .2s var(--ease); }
.complete-btn:hover { background: var(--gold-soft); transform: translateY(-1px); box-shadow: 0 8px 24px var(--gold-glow); }
.complete-btn.done { background: var(--ledger); color: #0B0E14; }
.complete-btn svg { width: 17px; height: 17px; }
.foot-nav { display: flex; gap: 10px; margin-left: auto; }
.foot-link { display: inline-flex; align-items: center; gap: 7px; padding: 11px 16px; border: 1px solid var(--line);
  border-radius: 10px; color: var(--text-soft); font-size: 13.5px; font-weight: 550; cursor: pointer; transition: all .18s; background: var(--surface); }
.foot-link:hover { border-color: var(--line-strong); color: var(--text); }
.foot-link svg { width: 15px; height: 15px; }

/* glossary chips at lesson bottom */
.term-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.term-chip { font-family: var(--mono); font-size: 12px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--gold-dim);
  color: var(--gold-soft); background: var(--gold-glow); cursor: pointer; transition: all .15s; }
.term-chip:hover { background: var(--gold); color: #14110A; }

/* ===================== RAIL (on this page) ===================== */
.rail-block { margin-bottom: 30px; }
.rail-label { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px; }
.rail-beat { display: flex; align-items: center; gap: 10px; padding: 5px 0; color: var(--text-mute); font-size: 12.5px; cursor: pointer; transition: color .15s; }
.rail-beat:hover { color: var(--text); }
.rail-beat .rb-num { font-family: var(--mono); font-size: 10px; width: 18px; color: var(--gold); }
.rail-actions { display: flex; flex-direction: column; gap: 8px; }
.rail-btn { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface); color: var(--text-soft); font-size: 12.5px; font-weight: 550; cursor: pointer; transition: all .15s; font-family: var(--sans); }
.rail-btn:hover { border-color: var(--line-strong); color: var(--text); }
.rail-btn svg { width: 15px; height: 15px; }
.rail-btn.on { color: var(--gold); border-color: var(--gold-dim); background: var(--gold-glow); }
.confidence { display: flex; gap: 6px; margin-top: 8px; }
.conf-dot { flex: 1; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-family: var(--mono); font-size: 11px; color: var(--text-faint); display: grid; place-items: center; transition: all .15s; }
.conf-dot:hover { border-color: var(--gold-dim); }
.conf-dot.sel { background: var(--gold); color: #14110A; border-color: var(--gold); }

/* ===================== HOME / DASHBOARD ===================== */
.hero { padding: 30px 0 10px; }
.hero-eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
.hero h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(36px, 6vw, 62px); line-height: 1.02; letter-spacing: -.025em; margin-bottom: 20px; }
.hero h1 .ital { font-style: italic; color: var(--gold-soft); }
.hero-lead { font-size: 19px; color: var(--text-soft); max-width: 640px; line-height: 1.55; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 30px; margin: 34px 0 10px; }
.hstat .hs-num { font-family: var(--serif); font-size: 34px; font-weight: 600; color: var(--text); line-height: 1; }
.hstat .hs-lab { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-mute); margin-top: 6px; }
.hero-cta { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }

.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap: 14px; margin: 30px 0; }
.pillar { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; background: var(--surface); transition: all .2s var(--ease); }
.pillar:hover { border-color: var(--gold-dim); transform: translateY(-2px); box-shadow: var(--shadow); }
.pillar .p-num { font-family: var(--mono); font-size: 11px; color: var(--gold); letter-spacing: .1em; }
.pillar .p-name { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 8px 0; }
.pillar .p-desc { font-size: 14px; color: var(--text-mute); line-height: 1.5; }
.pillar.new-badge .p-num::after { content: "NEW"; margin-left: 8px; background: var(--oxblood); color: #fff; padding: 1px 6px; border-radius: 4px; font-size: 9px; letter-spacing: .05em; }

.module-card { display: grid; grid-template-columns: 54px 1fr auto; gap: 16px; align-items: center; padding: 16px 18px;
  border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); cursor: pointer; margin-bottom: 10px; transition: all .18s var(--ease); }
.module-card:hover { border-color: var(--gold-dim); transform: translateX(3px); }
.mc-num { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--gold); text-align: center; }
.mc-title { font-weight: 600; font-size: 16px; margin-bottom: 3px; }
.mc-desc { font-size: 13px; color: var(--text-mute); line-height: 1.45; }
.mc-meta { font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-align: right; white-space: nowrap; }
.mc-bar { width: 90px; height: 5px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.mc-bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width .6s var(--ease); }

.section-head { display: flex; align-items: baseline; gap: 14px; margin: 46px 0 20px; }
.section-head h2 { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.section-head .sh-line { flex: 1; height: 1px; background: var(--line); }

/* ===================== GLOSSARY & FLASHCARDS ===================== */
.gloss-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 24px 0; }
.gloss-search { flex: 1; min-width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 15px; color: var(--text); font-size: 15px; font-family: var(--sans); }
.gloss-search:focus { outline: none; border-color: var(--gold-dim); }
.cluster-filter { display: flex; gap: 7px; flex-wrap: wrap; }
.cl-chip { font-family: var(--mono); font-size: 11.5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text-mute); cursor: pointer; transition: all .15s; }
.cl-chip:hover { border-color: var(--line-strong); }
.cl-chip.active { background: var(--gold); color: #14110A; border-color: var(--gold); }

.gterm { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; background: var(--surface); }
.gterm-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; transition: background .15s; }
.gterm-head:hover { background: var(--surface-2); }
.gterm-name { font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--gold-soft); }
.gterm-plain { font-size: 14px; color: var(--text-mute); flex: 1; }
.gterm-chev { width: 16px; color: var(--text-faint); transition: transform .25s; }
.gterm.open .gterm-chev { transform: rotate(180deg); }
.gterm-body { max-height: 0; overflow: hidden; transition: max-height .35s var(--ease); }
.gterm.open .gterm-body { max-height: 800px; }
.gterm-inner { padding: 0 18px 18px; border-top: 1px solid var(--line); }
.gfield { margin-top: 14px; }
.gfield-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 4px; }
.gfield p { font-size: 14.5px; color: var(--text-soft); margin: 0; }
.gfield .related-link { font-family: var(--mono); font-size: 12.5px; color: var(--gold); cursor: pointer; margin-right: 10px; }

/* flashcard mode */
.flash-stage { display: grid; place-items: center; min-height: 340px; margin: 30px 0; }
.flashcard { width: 100%; max-width: 540px; min-height: 280px; perspective: 1400px; cursor: pointer; }
.flash-inner { position: relative; width: 100%; min-height: 280px; transition: transform .6s var(--ease); transform-style: preserve-3d; }
.flashcard.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; border: 1px solid var(--line-strong); border-radius: var(--r-xl);
  padding: 36px; display: flex; flex-direction: column; justify-content: center; background: linear-gradient(160deg, var(--surface), var(--bg-elev)); box-shadow: var(--shadow); }
.flash-face.back { transform: rotateY(180deg); }
.flash-kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
.flash-term { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
.flash-hint { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); margin-top: 20px; }
.flash-def { font-size: 16px; color: var(--text-soft); line-height: 1.55; }
.flash-controls { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
.flash-meta { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--text-faint); margin-bottom: 16px; }

/* ===================== SEARCH MODAL ===================== */
.modal-overlay { position: fixed; inset: 0; background: rgba(5,7,11,.66); backdrop-filter: blur(5px); z-index: 100;
  display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.modal-overlay.show { display: flex; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.search-modal { width: 90%; max-width: 600px; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg); overflow: hidden; }
.search-input-row { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.search-input-row svg { width: 20px; height: 20px; color: var(--text-mute); }
.search-input-row input { flex: 1; background: none; border: none; color: var(--text); font-size: 17px; font-family: var(--sans); }
.search-input-row input:focus { outline: none; }
.search-results { max-height: 52vh; overflow-y: auto; padding: 8px; }
.sr-section { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); padding: 12px 12px 6px; }
.sr-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer; }
.sr-item:hover, .sr-item.sel { background: var(--surface-2); }
.sr-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--gold-glow); color: var(--gold); display: grid; place-items: center; flex: none; }
.sr-icon svg { width: 16px; height: 16px; }
.sr-title { font-size: 14.5px; font-weight: 550; color: var(--text); }
.sr-sub { font-size: 12px; color: var(--text-mute); }
.sr-empty { padding: 40px; text-align: center; color: var(--text-mute); font-size: 14px; }

/* toast */
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-elev);
  border: 1px solid var(--gold-dim); border-radius: 12px; padding: 13px 20px; box-shadow: var(--shadow-lg); z-index: 120;
  display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 550; opacity: 0; pointer-events: none; transition: all .35s var(--ease); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { width: 18px; height: 18px; color: var(--gold); }

/* mobile menu button */
.menu-btn { display: none; }
.scrim { display: none; }

/* ===================== RESPONSIVE ===================== */
@media (max-width: 1100px) {
  .main-inner { grid-template-columns: minmax(0,1fr); }
  .rail { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
  .brandcell { display: none; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 86%; max-width: 340px; z-index: 90;
    background: var(--bg-elev); height: 100vh; transform: translateX(-100%); transition: transform .3s var(--ease); padding-top: 16px; }
  .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
  .scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 80; }
  .menu-btn { display: grid; }
  .main-inner { padding: 0 20px; }
  .search-btn { max-width: none; }
  .search-btn .stext { display: none; }
  .ring-label { display: none; }
  .lesson-title { font-size: 30px; }
}

/* print */
@media print {
  .topbar, .brandcell, .sidebar, .rail, .lesson-foot, .quiz-opt, .branch, .menu-btn { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; }
  .reading { max-width: none; padding: 0; }
  .callout, .expand, .diagram { break-inside: avoid; border: 1px solid #ccc; }
  .expand-body { max-height: none !important; }
}

/* utility */
.hidden { display: none !important; }
.fade-up { animation: fadeUp .5s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: fadeUp .4s var(--ease) both; }
</style>
</head>
<body>

<div class="app">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Search lessons, modules, and glossary terms…" oninput="runSearch(this.value)" autocomplete="off">

<script>
/* ============================================================
   COURSE DATA — modules + lessons (seven-beat arc)
   Characters: Ananya Rao · Meridian & Solaris · Harv · The Risk Committee
   ============================================================ */
const COURSE = [

/* ===================== PART 1 ===================== */
{ id:'m1', num:'Part 1', title:'The History of AI: A Legal Time Machine',
  blurb:'From 1950s logic theorists to today\u2019s agents \u2014 and why the 1980s legal-AI hype collapsed before you trust this one.',
  lessons:[
  {
    id:'l1-1', title:'The Machine That Argued Like a Lawyer (1956)', mins:'18\u201322', device:'The Time Machine',
    dek:'Before there were neural networks, there was a program that proved logical theorems \u2014 and a room full of people who thought they had just built a mind.',
    terms:['Symbolic AI','Expert System','AI Winter'],
    blocks:[
      {t:'beats', items:[
        { kicker:'The Hook', name:'Dartmouth, summer of 1956', blocks:[
          {t:'p', x:'A small group of mathematicians has booked a room at Dartmouth College for the summer. Their funding proposal contains a sentence so confident it is almost reckless: that <em>every aspect of learning or any feature of intelligence can in principle be so precisely described that a machine can be made to simulate it.</em> They expect serious progress in eight weeks.'},
          {t:'p', x:'One program they demonstrate, the Logic Theorist, does something uncanny. Given the axioms of basic logic, it proves theorems \u2014 and for at least one, finds a proof more elegant than the textbook\u2019s. The room is electric. If a machine can reason through formal logic, surely a machine that reasons through a statute is just around the corner.'},
          {t:'p', x:'It was not around the corner. It was forty years away, and would arrive looking nothing like what anyone imagined. Understanding <em>why</em> is the best inoculation you can have against today\u2019s hype.'}
        ]},
        { kicker:'The Human Problem', name:'What were they actually trying to do?', blocks:[
          {t:'p', x:'The dream was older than computers: capture human expertise as <strong>rules</strong>, then let a machine apply them faster and more consistently than a tired human could. If a senior partner\u2019s judgment could be written down as <em>if\u2013then</em> statements, you could bottle it.'},
          {t:'p', x:'This is not strange to a lawyer. It is, roughly, what a well-drafted compliance checklist is: <em>if</em> the counterparty is a politically exposed person, <em>then</em> enhanced due diligence applies. The first era of AI \u2014 <strong>symbolic AI</strong> \u2014 tried to build the entire mind out of checklists like that.'}
        ]},
        { kicker:'The Analogy', name:'The world\u2019s most ambitious checklist', blocks:[
          {t:'p', x:'Picture a junior associate who has memorised every rule in a practice area but has zero intuition. Ask her something the rules cover, and she is flawless. Ask her anything between the rules \u2014 anything needing judgment or common sense \u2014 and she freezes, or worse, gives a confidently wrong answer because she follows a rule into a situation it was never meant for.'},
          {t:'p', x:'That associate is a symbolic AI system. In the 1980s these were sold to businesses as <strong>expert systems</strong>, and law and tax were among the very first customers \u2014 rule-checkers that encoded an expert\u2019s knowledge as hundreds of hand-written rules.'}
        ]},
        { kicker:'The Aha Moment', blocks:[
          {t:'aha', x:'Early AI didn\u2019t fail because the rules were wrong. It failed because no one can write down enough rules to cover the real world \u2014 and the world keeps producing situations the rules never anticipated.'}
        ]},
        { kicker:'The Visual', name:'Two centuries of hope and disappointment', blocks:[
          {t:'diagram', cap:'The AI timeline, anchored to the legal world', code:'timeline\n    title A Legal Time Machine\n    1956 : Dartmouth : Logic Theorist proves theorems\n    1980s : Expert systems : Tax and compliance rule-checkers sold to firms\n    1987 : First AI Winter : Hype collapses, funding dries up\n    2012 : ImageNet : Deep learning crushes the competition\n    2017 : Transformers : Attention Is All You Need\n    2022 : ChatGPT : Generative AI reaches every desk\n    Today : Agents : AI that takes multi-step action'}
        ]},
        { kicker:'The Walkthrough', name:'Why the 1980s legal-AI boom collapsed', blocks:[
          {t:'p', x:'A real example, simplified. An expert system for tax advice contains the rule: <em>if</em> an asset is held longer than one year, <em>then</em> apply the long-term rate. Clean. Now the law changes mid-year, with a transition rule for assets bought before a certain date. A human adapts in seconds. The expert system cannot \u2014 someone must find the affected rule, rewrite it by hand, test it, and hope they did not break three other rules that quietly depended on it.'},
          {t:'olist', items:[
            'Every rule had to be hand-written by a human expert \u2014 slow and expensive.',
            'The rules could not handle anything outside their explicit coverage \u2014 they were <strong>brittle</strong>.',
            'As systems grew, the rules began to contradict each other in ways nobody could trace.',
            'Maintaining them cost more than the experts they were meant to replace.'
          ]},
          {t:'p', x:'By the late 1980s the money dried up \u2014 an <strong>AI Winter</strong>. The lesson for you is not trivia. It is that <em>a technology can be genuinely impressive in a demo and still be commercially catastrophic in production</em> \u2014 exactly the judgment a client will one day ask you to make about a LegalTech tool.'}
        ]},
        { kicker:'The Technical Layer', name:'Now, the real words', blocks:[
          {t:'p', x:'You have now understood three terms before meeting their definitions \u2014 which is the whole point of this course.'},
          {t:'list', items:[
            '<strong>Symbolic AI</strong> (\u201cgood old-fashioned AI\u201d): intelligence built from explicit, human-written rules and logical symbols. The checklist taken to its extreme.',
            '<strong>Expert system</strong>: a 1970s\u201380s commercial form of symbolic AI encoding an expert\u2019s knowledge as <em>if\u2013then</em> rules. Law, medicine and tax were early adopters.',
            '<strong>AI Winter</strong>: a period when AI funding and interest collapsed after over-promising. There were two big ones (mid-1970s and late 1980s) \u2014 useful as a pattern, not just a date.'
          ]},
          {t:'curious', title:'For the Curious \u2014 the bitter lesson', x:'Decades later, the field learned what researcher Rich Sutton called \u201cthe bitter lesson\u201d: methods that <em>learn from data</em> reliably beat methods where humans hand-code knowledge, given enough data and compute. Everything from Part 3 onward is that idea winning. Modern AI does not encode the rules \u2014 it learns the patterns.'}
        ]}
      ]},
      {t:'quiz', questions:[
        { q:'A LegalTech vendor demos a tool that flawlessly answers ten sample contract questions. What is the single most important thing to probe?',
          options:['How fast it answered','Whether it handles situations outside its examples without breaking','Whether the UI is modern','How many rules it contains'],
          answer:1,
          why:'A flawless demo proves coverage of the chosen examples \u2014 nothing more. Brittleness outside coverage is exactly how expert systems failed.',
          reexplain:'Think of the rule-following junior associate: perfect on what the rules cover, dangerously confident outside them. A demo only shows you the inside of the coverage. The real risk lives outside it.' },
        { q:'Why did 1980s expert systems become commercially unviable?',
          options:['Computers were too slow','The rules had to be hand-written and maintained by expensive experts, and broke outside their coverage','Lawyers refused to use them','They were illegal under data-protection law'],
          answer:1,
          why:'Hand-authored, brittle, contradiction-prone rules cost more to maintain than the experts they replaced.',
          reexplain:'It was not one fatal flaw \u2014 it was the maintenance burden. Every change risked breaking hidden dependencies, and only a human expert could write or fix a rule. The economics stopped working.' }
      ]},
      {t:'branch', prompt:'You are Ananya. A partner forwards you a slick expert-system-style \u201cAI compliance advisor\u201d a vendor wants the firm to buy, and asks: \u201cWorth a pilot?\u201d What do you do first?',
        choices:[
          { label:'Recommend buying it \u2014 the demo was flawless', verdict:'bad',
            outcome:'Three months in, a regulation changes and the tool keeps giving the old answer with full confidence. Nobody at the firm can fix the underlying rules \u2014 only the vendor can, slowly. You have relived the AI Winter in miniature. A flawless demo was never evidence of robustness.' },
          { label:'Ask the vendor how the tool behaves when the law changes or a question falls outside its examples', verdict:'good',
            outcome:'Exactly right. You went straight to the brittleness question that killed expert systems. The vendor\u2019s answer \u2014 do they retrain, hand-edit rules, or fall back to a human? \u2014 tells you whether this is a robust product or a polished demo waiting to break.' },
          { label:'Decline outright \u2014 AI tools always fail', verdict:'mixed',
            outcome:'Defensible caution, but it throws away real value. The point is not that AI fails \u2014 it is that you must interrogate <em>how</em> it fails. Modern learning-based tools are not 1980s expert systems. The skill is telling them apart.' }
        ]},
      {t:'exercise', id:'ex-1-1', tag:'Explain It Back', title:'Teach it to a junior associate',
        intro:'In your own words, explain to a first-year why a perfect product demo is not proof that an AI tool is safe to deploy. (Saved to this browser; not graded.)',
        placeholder:'A demo only shows you\u2026',
        model:[
          {t:'p', x:'<strong>A strong answer hits three beats:</strong>'},
          {t:'list', items:[
            'A demo only tests the situations the demo chose \u2014 it shows coverage, not robustness.',
            'The real risk is the long tail of situations the tool was never built for, where it may fail silently and confidently.',
            'So the question is not \u201cdid it get these right?\u201d but \u201cwhat does it do when it meets something new, or when the law changes?\u201d'
          ]}
        ]}
    ]
  },

    terms:['Machine Learning','Deep Learning','Neural Network'],
